<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame</title>
<style>
  /* Laid out for the frame on its side (portrait): the photo above, the
     board below. A landscape screen puts the board beside the photo. */
  :root {
    --ink: #2a2019; --dim: #6a5a4b; --faint: #93806b; --rule: #d2c2a8;
    --paper: #e4d6bf;
    --u: min(1vw, 0.5625vh);
  }
  /* No pinch zoom, scrolling or text selection: the frame is touched, not read. */
  html { touch-action: none; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: var(--paper); color: var(--ink);
    font-family: system-ui, "Roboto", sans-serif;
  }
  body { display: grid; grid-template-rows: 45fr 55fr; }
  @media (orientation: landscape) {
    body { grid-template-rows: none; grid-template-columns: 62fr 38fr; }
    :root { --u: min(0.5625vw, 1vh); }
  }
  /* The menu's views: the photo or the board alone, full screen. */
  body[data-view=photos], body[data-view=calendar] { grid-template: 1fr / 1fr; }
  body[data-view=photos] #board, body[data-view=calendar] #photo { display: none; }
  body[data-view=calendar] { --u: min(0.75vw, 0.75vh); }

  #photo { position: relative; overflow: hidden; background: var(--paper); }
  #photo .slot { position: absolute; inset: 0; overflow: hidden; will-change: transform, opacity; }
  #photo .slot:nth-child(1) { transform: translateX(-100%); }
  #photo .slot:nth-child(3) { transform: translateX(100%); }
  #photo canvas, #photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #photo img { object-fit: contain; }

  #board {
    display: flex; flex-direction: column; gap: calc(3 * var(--u));
    padding: calc(5 * var(--u)) calc(6 * var(--u));
    min-height: 0; box-sizing: border-box;
  }

  #top { display: flex; align-items: flex-end; justify-content: space-between; }
  #clock {
    font-size: calc(15 * var(--u)); font-weight: 200; line-height: .9;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  #date { font-size: calc(4 * var(--u)); color: var(--dim); margin-top: calc(1.5 * var(--u)); }
  #now { text-align: right; }
  #now .icon { font-size: calc(9 * var(--u)); line-height: 1; }
  #now .temp { font-size: calc(9 * var(--u)); font-weight: 200; line-height: 1; }
  #now .feels { font-size: calc(3 * var(--u)); color: var(--dim); }

  #days {
    display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: calc(2 * var(--u)) 0;
  }
  #days:empty { display: none; }
  .day { text-align: center; font-size: calc(3.2 * var(--u)); }
  .day .name { color: var(--dim); }
  .day .icon { font-size: calc(6 * var(--u)); line-height: 1.3; }
  .day .lo { color: var(--faint); }
  .day .rain { color: #3f6f9a; font-size: calc(2.6 * var(--u)); min-height: 1.2em; }

  #agenda { flex: 1; min-height: 0; overflow: hidden; font-size: calc(3.4 * var(--u)); }
  #agenda h2 {
    margin: calc(2 * var(--u)) 0 calc(.8 * var(--u)); font-size: calc(2.8 * var(--u));
    font-weight: 500; color: var(--faint); text-transform: uppercase; letter-spacing: .12em;
  }
  #agenda h2:first-child { margin-top: 0; }
  .ev { display: flex; gap: calc(2 * var(--u)); align-items: baseline; padding: calc(.5 * var(--u)) 0; }
  .ev .when {
    flex: 0 0 calc(15 * var(--u)); color: var(--dim);
    font-variant-numeric: tabular-nums; font-size: .9em;
  }
  .ev .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .what::before {
    content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%;
    background: var(--c); margin-right: .6em; vertical-align: .12em;
  }
  .ev .where { color: var(--faint); font-size: .85em; }
  .quiet { color: var(--faint); }

  /* The calendar view on a landscape screen: the week as seven columns. */
  #week { display: none; }
  @media (orientation: landscape) {
    body[data-view=calendar] #days, body[data-view=calendar] #agenda { display: none; }
    body[data-view=calendar] #week {
      display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; min-height: 0;
      border-top: 1px solid var(--rule);
    }
  }
  #week .col { min-width: 0; overflow: hidden; padding: calc(2 * var(--u)) calc(1.4 * var(--u)); }
  #week .col + .col { border-left: 1px solid var(--rule); }
  #week .today { background: #ede2cf; }
  #week .head { margin-bottom: calc(2 * var(--u)); }
  #week .name { font-size: calc(2.8 * var(--u)); color: var(--faint); text-transform: uppercase; letter-spacing: .12em; }
  #week .num { font-size: calc(8 * var(--u)); font-weight: 200; line-height: 1.1; }
  #week .today .num { color: #b0482a; }
  #week .wx { font-size: calc(3 * var(--u)); color: var(--dim); }
  #week .item {
    background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: calc(1.2 * var(--u));
    border-left: calc(.8 * var(--u)) solid var(--c);
    padding: calc(1 * var(--u)) calc(1.4 * var(--u)); margin-bottom: calc(1.2 * var(--u));
    font-size: calc(3.4 * var(--u)); line-height: 1.25;
  }
  #week .item .t { color: var(--dim); font-size: .8em; font-variant-numeric: tabular-nums; }

  /* Held open by two fingers kept still on the screen. */
  #menu {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgb(42 32 25 / .25); z-index: 10;
  }
  #menu[hidden] { display: none; }
  #menu .card {
    background: #ede2cf; border-radius: 24px; padding: 28px;
    box-shadow: 0 12px 40px rgb(42 32 25 / .25); font-size: 26px;
  }
  #menu nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  #menu button {
    font: inherit; color: var(--ink); background: var(--paper); border: 0;
    border-radius: 16px; padding: 18px 26px; min-width: 130px;
  }
  #menu nav button { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #menu nav button span { font-size: 44px; line-height: 1; }
  #menu button.on { background: #b0482a; color: #f6efe3; }
  #settings { margin-top: 24px; border-top: 1px solid var(--rule); padding-top: 20px; }
  #settings[hidden] { display: none; }
  #settings .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #settings .row > div { flex: 1; color: var(--dim); }
  #settings .row button { min-width: 0; padding: 12px 18px; }
</style>
</head>
<body>
<div id="photo">
  <div class="slot"><canvas></canvas><img alt=""></div>
  <div class="slot"><canvas></canvas><img alt=""></div>
  <div class="slot"><canvas></canvas><img alt=""></div>
</div>
<div id="board">
  <div id="top">
    <div><div id="clock"></div><div id="date"></div></div>
    <div id="now"></div>
  </div>
  <div id="days"></div>
  <div id="agenda"></div>
  <div id="week"></div>
</div>
<div id="menu" hidden>
  <div class="card">
    <nav>
      <button data-view="home"><span>🏠</span>Home</button>
      <button data-view="calendar"><span>📅</span>Calendar</button>
      <button data-view="photos"><span>🖼️</span>Photos</button>
      <button id="gear"><span>⚙️</span>Settings</button>
    </nav>
    <div id="settings" hidden>
      <div class="row"><div>Each photo</div>
        <button data-show="15">15 s</button><button data-show="30">30 s</button>
        <button data-show="60">1 min</button><button data-show="300">5 min</button></div>
      <div class="row"><div>Refresh the frame</div><button id="reload">Reload</button></div>
    </div>
  </div>
</div>
<script>
// How long each photo stays, how often the album and the board are read.
// Each photo's time is a setting, kept on the frame.
const LIST = 10 * 60e3, BOARD = 5 * 60e3;
let SHOW = (Number(localStorage.show) || 30) * 1e3;
const $ = id => document.getElementById(id);
let order = [], boot = null, board = null;

// WMO weather codes, as Open-Meteo reports them.
function icon(code, day = true) {
  if (code === 0) return day ? "☀️" : "🌙";
  if (code <= 2) return day ? "⛅" : "☁️";
  if (code === 3) return "☁️";
  if (code <= 48) return "🌫️";
  if (code <= 67 || (code >= 80 && code <= 82)) return "🌧️";
  if (code <= 77 || code === 85 || code === 86) return "🌨️";
  return "⛈️";
}

const deg = t => Math.round(t) + "°";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const asDate = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const weekday = (s, form = "short") => asDate(s).toLocaleDateString([], { weekday: form });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// A steady colour per calendar, so each person's events read at a glance.
function hue(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 45% 42%)`;
}

function tick() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/i, "");
  $("date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
}

function drawWeather(w) {
  const now = $("now"), days = $("days");
  now.replaceChildren(); days.replaceChildren();
  if (!w) return;
  now.append(el("div", "icon", icon(w.now.code, w.now.day)), el("div", "temp", deg(w.now.temp)),
             el("div", "feels", "feels " + deg(w.now.feels)));
  const today = ymd(new Date());
  for (const d of w.days) {
    const cell = el("div", "day");
    cell.append(el("div", "name", d.date === today ? "Today" : weekday(d.date)),
                el("div", "icon", icon(d.code)));
    const t = el("div");
    t.append(deg(d.high) + " ", el("span", "lo", deg(d.low)));
    cell.append(t, el("div", "rain", d.rain >= 20 ? d.rain + "%" : ""));
    days.append(cell);
  }
}

// Events by day from today. A whole-day event shows on each day it covers;
// a timed one on its start day, until it ends.
function week(events) {
  const now = new Date(), today = ymd(now);
  const byDay = new Map();
  for (let i = 0; i < 7; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    byDay.set(ymd(d), []);
  }
  for (const e of events) {
    if (e.start.length === 10) {
      const last = e.end ? asDate(e.end) : asDate(e.start);
      if (e.end) last.setDate(last.getDate() - 1);
      for (const [day, list] of byDay)
        if (day >= e.start && asDate(day) <= last) list.push({ ...e, allDay: true });
    } else {
      const day = e.start.slice(0, 10);
      const ends = new Date((e.end || e.start).replace(" ", "T"));
      if (byDay.has(day) && (day !== today || ends > now)) byDay.get(day).push(e);
    }
  }
  for (const list of byDay.values())
    list.sort((a, b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0) || a.start.localeCompare(b.start));
  return byDay;
}

const clock = e => e.allDay ? "all day"
  : new Date(e.start.replace(" ", "T")).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function drawAgenda(events) {
  const box = $("agenda");
  box.replaceChildren();
  if (!events) return;
  const now = new Date(), today = ymd(now);
  let any = false;
  for (const [day, list] of week(events)) {
    if (!list.length) continue;
    any = true;
    const tomorrow = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
    box.append(el("h2", null, day === today ? "Today" : day === tomorrow ? "Tomorrow"
      : asDate(day).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" })));
    for (const e of list) {
      const row = el("div", "ev");
      row.style.setProperty("--c", hue(e.calendar));
      const when = clock(e);
      const what = el("div", "what", e.summary);
      if (e.location) what.append(el("span", "where", " · " + e.location));
      row.append(el("div", "when", when), what);
      box.append(row);
    }
  }
  if (!any) box.append(el("div", "quiet", "Nothing on the calendar this week."));
  // Drop the last rows that do not fit, and a day heading left bare.
  while (box.scrollHeight > box.clientHeight && box.children.length > 1) {
    box.lastChild.remove();
    if (box.lastChild && box.lastChild.tagName === "H2") box.lastChild.remove();
  }
}

// The calendar view's week: a column a day, with its forecast.
function drawWeek(events, weather) {
  const box = $("week");
  box.replaceChildren();
  const wx = new Map((weather ? weather.days : []).map(d => [d.date, d]));
  const today = ymd(new Date());
  for (const [day, list] of week(events || [])) {
    const col = el("div", day === today ? "col today" : "col"), head = el("div", "head");
    head.append(el("div", "name", day === today ? "Today" : weekday(day)),
                el("div", "num", String(asDate(day).getDate())));
    const w = wx.get(day);
    if (w) head.append(el("div", "wx", `${icon(w.code)} ${deg(w.high)} / ${deg(w.low)}`));
    col.append(head);
    for (const e of list) {
      const item = el("div", "item");
      item.style.setProperty("--c", hue(e.calendar));
      item.append(el("div", "t", clock(e)), el("div", null, e.summary));
      col.append(item);
    }
    box.append(col);
  }
}

function draw() {
  if (!board) return;
  drawWeather(board.weather);
  drawAgenda(board.events);
  drawWeek(board.events, board.weather);
}

async function readBoard() {
  try {
    const r = await fetch("/api/board", { cache: "no-store" });
    if (!r.ok) return;
    board = await r.json();
    // A deploy restarts the server; reload so the wall gets the new page.
    if (boot !== null && board.boot !== boot) return location.reload();
    boot = board.boot;
    draw();
  } catch {}
}

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

async function list() {
  try {
    const r = await fetch("/api/photos");
    if (!r.ok) return;
    const ids = await r.json();
    // A new shuffle only when the album changed, so the cycle runs through.
    if (ids.length !== order.length || ids.some(id => !order.includes(id))) {
      order = shuffle(ids);
      shown = -1;
      if (!busy && !drag) neighbours();
    }
  } catch {}
}

// Three slots: the previous photo off to the left, the shown one, the next
// off to the right. Each is loaded, decoded and given its blurred fill ahead
// of time, so a swipe or a fade only moves layers that are already drawn;
// the frame's GPU is too slow to blur or decode while a finger moves.
const slots = [...document.querySelectorAll("#photo .slot")].map(el =>
  ({ el, img: el.querySelector("img"), fill: el.querySelector("canvas"), id: null, ready: null }));
let [prev, cur, nxt] = slots;
let shown = -1, busy = false, drag = null;
const at = k => order[(k % order.length + order.length) % order.length];
const wait = ms => new Promise(r => setTimeout(r, ms));

// The fill behind the photo's bars: the photo drawn tiny and blurred once,
// then stretched, which looks the same as a large blur and costs nothing
// to move.
function paint(s) {
  const c = s.fill, iw = s.img.naturalWidth, ih = s.img.naturalHeight;
  if (!iw || !c.clientWidth) return;
  const w = 40, h = Math.max(1, Math.round(w * c.clientHeight / c.clientWidth));
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.filter = "blur(2px) brightness(1.1) saturate(.7)";
  const k = Math.max(w / iw, h / ih) * 1.2;
  g.drawImage(s.img, (w - iw * k) / 2, (h - ih * k) / 2, iw * k, ih * k);
}
new ResizeObserver(() => slots.forEach(paint)).observe($("photo"));

function load(s, id) {
  if (s.id !== id) {
    s.id = id;
    s.img.src = "/photo/" + id;
    s.ready = s.img.decode().then(() => paint(s), () => {});
  }
  return s.ready;
}

function neighbours() {
  if (!order.length) return;
  load(prev, at(shown - 1));
  load(nxt, at(shown + 1));
}

// Puts the three slots side by side, shifted by a finger's dx.
function lay(dx = 0, ease = false) {
  [prev, cur, nxt].forEach((s, k) => {
    s.el.style.transition = ease ? "transform .3s ease-out" : "none";
    s.el.style.transform = `translateX(calc(${(k - 1) * 100}% + ${dx}px))`;
  });
}

// Fades the next photo in over the shown one.
async function advance() {
  if (!order.length || busy || drag) return;
  busy = true;
  const s = nxt;
  await load(s, at(shown + 1));
  if (s.id !== cur.id) {
    s.el.style.cssText = "transition: none; transform: none; opacity: 0; z-index: 2";
    void s.el.offsetWidth;
    s.el.style.transition = "opacity 1.5s";
    s.el.style.opacity = 1;
    await wait(1500);
    s.el.style.cssText = "";
  }
  shown++;
  [prev, cur, nxt] = [cur, nxt, prev];
  lay();
  neighbours();
  busy = false;
}

let timer;
function restart() {
  clearInterval(timer);
  timer = setInterval(advance, SHOW);
}

// Dragging the photo moves it with the finger, the neighbour sliding in
// beside it, as Frameo does. Let go past a fifth of the width, or flick, and
// it carries on to that photo and restarts its time on screen; otherwise it
// springs back. A second finger springs it back too (it may be the menu).
$("photo").addEventListener("pointerdown", e => {
  if (drag && e.pointerId !== drag.id) return void release(null);
  if (order.length < 2 || drag || busy || !e.isPrimary) return;
  $("photo").setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, x: e.clientX, dx: 0, t: e.timeStamp, v: 0, raf: 0 };
});
$("photo").addEventListener("pointermove", e => {
  if (!drag || drag.done || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  drag.v = (dx - drag.dx) / Math.max(e.timeStamp - drag.t, 1);
  drag.dx = dx;
  drag.t = e.timeStamp;
  // One move per frame, however many events the screen sends.
  if (!drag.raf) drag.raf = requestAnimationFrame(() => {
    if (drag && !drag.done) { drag.raf = 0; lay(drag.dx); }
  });
});
async function release(e) {
  if (!drag || drag.done || (e && e.pointerId !== drag.id)) return;
  const d = drag;
  d.done = true;
  cancelAnimationFrame(d.raf);
  const side = Math.sign(d.dx), w = $("photo").clientWidth;
  const go = e && side && (Math.abs(d.dx) > w / 5 || (Math.abs(d.dx) > 30 && Math.sign(d.v) === side && Math.abs(d.v) > .4));
  lay(go ? side * w : 0, true);
  await wait(300);
  if (go) {
    if (side < 0) { shown++; [prev, cur, nxt] = [cur, nxt, prev]; }
    else { shown--; [prev, cur, nxt] = [nxt, prev, cur]; }
    lay();
    neighbours();
    restart();
  }
  drag = null;
}
$("photo").addEventListener("pointerup", release);
$("photo").addEventListener("pointercancel", release);

// The menu: two fingers held still for a second and a half, as on Wes Bos's
// frame dashboard. It closes on a choice, a tap outside, or by itself.
const fingers = new Map();
let hold = 0, idle = 0;
addEventListener("pointerdown", e => {
  fingers.set(e.pointerId, [e.clientX, e.clientY]);
  clearTimeout(hold);
  if (fingers.size === 2) hold = setTimeout(openMenu, 1500);
}, true);
addEventListener("pointermove", e => {
  const f = fingers.get(e.pointerId);
  if (f && Math.hypot(e.clientX - f[0], e.clientY - f[1]) > 40) clearTimeout(hold);
}, true);
for (const t of ["pointerup", "pointercancel"])
  addEventListener(t, e => { fingers.delete(e.pointerId); clearTimeout(hold); }, true);

function mark() {
  for (const b of document.querySelectorAll("[data-view]"))
    b.classList.toggle("on", b.dataset.view === document.body.dataset.view);
  for (const b of document.querySelectorAll("[data-show]"))
    b.classList.toggle("on", Number(b.dataset.show) * 1e3 === SHOW);
}
function openMenu() {
  if (drag) release(null);
  $("settings").hidden = true;
  mark();
  $("menu").hidden = false;
  touched();
}
function closeMenu() { $("menu").hidden = true; clearTimeout(idle); }
function touched() { clearTimeout(idle); idle = setTimeout(closeMenu, 20e3); }
$("menu").addEventListener("click", e => {
  touched();
  const b = e.target.closest("button");
  if (!b) return void (e.target === $("menu") && closeMenu());
  if (b.dataset.view) {
    document.body.dataset.view = localStorage.view = b.dataset.view;
    return closeMenu();
  }
  if (b.dataset.show) {
    SHOW = Number(localStorage.show = b.dataset.show) * 1e3;
    restart();
    return mark();
  }
  if (b.id === "gear") $("settings").hidden = !$("settings").hidden;
  if (b.id === "reload") location.reload();
});

document.body.dataset.view = localStorage.view || "home";
tick();
setInterval(tick, 1e3);
readBoard();
setInterval(readBoard, BOARD);
// Redraw at each new minute too, so past events drop off and days roll over.
setInterval(draw, 60e3);
list().then(advance);
setInterval(list, LIST);
restart();
// A daily reload lets the WebView start clean, once the server answers: a
// reload that fails leaves the kiosk on an error page with nothing to retry.
setTimeout(async function fresh() {
  try {
    if ((await fetch("/api/board", { cache: "no-store" })).ok) return location.reload();
  } catch {}
  setTimeout(fresh, 60e3);
}, 24 * 3600e3);
</script>
</body>
</html>

[package]
name = "frame"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true

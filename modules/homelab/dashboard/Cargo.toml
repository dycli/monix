[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
strip = true

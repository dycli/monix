<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endgrain schedule</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ece3d4; color: #2b2620; font: 16px/1.45 system-ui, sans-serif; }
  form { background: #f4ede1; border: 1px solid #d6cab6; border-radius: 16px; padding: 28px 24px; width: min(320px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 14px; }
  h1 { font: 400 28px Georgia, serif; margin: 0; }
  input, button { font: inherit; border-radius: 10px; padding: 10px 12px; }
  input { border: 1px solid #d6cab6; background: #ece3d4; color: inherit; }
  button { border: 0; background: #2b2620; color: #f4ede1; cursor: pointer; }
  .wrong { color: #b0482a; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Endgrain</h1>
  <!--wrong-->
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button>Sign in</button>
</form>
</body>
</html>

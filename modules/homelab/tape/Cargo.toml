[package]
name = "tape"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The live gateway speaks raw TCP with a challenge-response login, so the
# `live` feature needs no TLS stack; history goes over ureq below.
databento = { version = "0.63", default-features = false, features = ["live"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true

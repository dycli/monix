[package]
name = "yeoman"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "markdown"] }
# matrix-sdk always builds reqwest with rustls and leaves the provider to us.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
mime = "0.3"
roxmltree = "0.20"
rusqlite = { version = "0.40", default-features = false, features = ["cache"] }
rmcp = { version = "3.5", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
mail-parser = "0.11.9"
webpki-roots = "1.0.9"
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
getrandom = "0.4"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-layer = "0.3"
web-push-native = "0.5"

[profile.release]
lto = "thin"
strip = true

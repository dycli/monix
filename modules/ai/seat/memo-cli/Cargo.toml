[package]
name = "memo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
# Python's re.I case-folds Unicode. The full engine preserves that upstream
# behavior while retaining Rust regex's linear-time guarantee.
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true

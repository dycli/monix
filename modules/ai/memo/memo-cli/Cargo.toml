[package]
name = "memo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
# regex-lite over regex: same authors and linear-time guarantee, zero
# transitive deps; recall patterns don't need the optimized engines.
regex-lite = "0.1"

[profile.release]
lto = "thin"
strip = true

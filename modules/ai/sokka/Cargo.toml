[package]
name = "sokka"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "bundled-sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true

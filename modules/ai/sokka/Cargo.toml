[package]
name = "sokka"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "bundled-sqlite"] }
# matrix-sdk always builds reqwest with rustls and leaves the provider to us.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1b18" media="(prefers-color-scheme: dark)" />
    <title>Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f4efe6' stroke='%23332e27' stroke-width='2'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%232a78d6'/%3E%3Ccircle cx='20' cy='19' r='6' fill='%23eb6834'/%3E%3Ccircle cx='20' cy='10' r='3' fill='%231baf7a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#overview">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" class="ring" /><circle cx="12" cy="13" r="5" class="b1" /><circle cx="20" cy="19" r="6" class="b2" /><circle cx="20" cy="10" r="3" class="b3" /></svg>
        <span>Atlas</span>
      </a>
      <nav class="tabs" role="tablist">
        <a href="#overview" data-view="overview">Overview</a>
        <a href="#map" data-view="map">Map</a>
        <a href="#wiring" data-view="wiring">Wiring</a>
        <a href="#machines" data-view="machines">Machines</a>
        <a href="#tours" data-view="tours">Tours</a>
      </nav>
      <div class="tools">
        <button class="search-btn" id="search-open" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg><span>Search</span><kbd>⌘K</kbd></button>
        <button class="icon" id="help-open" aria-label="What am I looking at?">?</button>
        <button class="icon" id="theme" aria-label="Switch light and dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg></button>
      </div>
    </header>
    <main id="app"><div class="loading">Reading the codebase…</div></main>
    <aside id="panel" class="panel" hidden></aside>
    <div id="tip" class="tip" hidden></div>
    <dialog id="search"></dialog>
    <dialog id="help"></dialog>
    <div id="tourbar" class="tourbar" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

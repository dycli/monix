# Guided tours through the system, shown on atlas.su.is. Each step picks a
# view and lights up its focus: "monix:<module id>" for a module on the
# Wiring view, "<repo>:<path>" for a file or directory on the Map.
# `atlas.py check` (a flake check) fails if a focus stops existing, so a
# rename here is caught before deploy.

[[tour]]
id = "deploy"
title = "From commit to running"
summary = "How a pushed change reaches the machines, and how it backs out."

[[tour.step]]
title = "One flake, four machines"
view = "machines"
focus = ["monix:hosts/water", "monix:hosts/earth", "monix:hosts/fire", "monix:hosts/air"]
text = """
monix is one Nix flake. Each machine is a host that picks the modules it
runs; the Machines view shows what each one carries, sized by lines."""

[[tour.step]]
title = "The checks"
view = "wiring"
focus = ["monix:options/checks.mod.nix"]
text = """
Before a push, `nix flake check` builds every host and runs each module's
own tests. A change that breaks any machine fails here, not in production."""

[[tour.step]]
title = "The mirror"
view = "wiring"
focus = ["monix:modules/homelab/git-mirror.mod.nix"]
text = """
Water keeps a mirror of every repository on the NAS, refreshed every five
minutes. Deploys read from it, so a GitHub outage cannot block one, and
this atlas scans it."""

[[tour.step]]
title = "switcharoo"
view = "wiring"
focus = ["monix:modules/core/switcharoo.mod.nix"]
text = """
switcharoo builds pushed main, activates it as a test, and watches. If a
unit newly fails, the previous system comes back on its own. Only a healthy
system becomes the boot default. Changes to fenced files need the captain's
`switcharoo --approve`."""

[[tour]]
id = "web"
title = "A web request"
summary = "How a name like frame.su.is reaches a program on Water."

[[tour.step]]
title = "ship-proxy"
view = "wiring"
focus = ["monix:modules/homelab/ship-proxy.mod.nix"]
text = """
nginx on Water terminates TLS for every <name>.su.is with one wildcard
certificate. The names resolve publicly but only route inside the tailnet."""

[[tour.step]]
title = "Routes"
view = "wiring"
focus = ["monix:modules/homelab/hob.mod.nix", "monix:modules/homelab/immich.mod.nix", "monix:modules/homelab/media.mod.nix", "monix:modules/homelab/money.mod.nix"]
text = """
Each module that wants a web address declares a route: a name and a local
port. The dashed "served by" lines on the Wiring view are those routes."""

[[tour.step]]
title = "A program behind it"
view = "map"
focus = ["monix:modules/homelab/money"]
text = """
Behind money.su.is is a Rust program, built from this repository. On the
Map you can open it and see each file, sized by its lines."""

[[tour]]
id = "hippo"
title = "How hippo2 remembers"
summary = "The memory daemon each assistant reads from: session logs, SQLite FTS5, and MCP recall."

[[tour.step]]
title = "The store"
view = "map"
focus = ["hippo2:src/store.rs"]
text = """
Every message is filed word for word into one SQLite database per named
memory, indexed with FTS5 and porter stemming. No model is called on ingest."""

[[tour.step]]
title = "The readers"
view = "map"
focus = ["hippo2:src/ingest.rs", "hippo2:src/libri_core.rs"]
text = """
The daemon tails every harness's session logs and each assistant's Libri core
event log past a saved cursor, keeping turns and tool traffic while dropping
injected prompts."""

[[tour.step]]
title = "Recall over MCP"
view = "map"
focus = ["hippo2:src/search.rs", "hippo2:src/mcp.rs"]
text = """
BM25 search with spelling repair answers recall, open, around, timeline, day,
and grep queries over stdio MCP without sending history to a summariser."""

[[tour.step]]
title = "Who uses it"
view = "wiring"
focus = ["monix:modules/ai/seat/hippo2.mod.nix", "monix:modules/ai/libri.mod.nix"]
text = """
The seat runs hippo2 over Bridge's Libri core and terminal harnesses; each
isolated assistant runs its own hippo2 instance over its own core socket."""
